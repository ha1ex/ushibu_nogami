<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Полноэкранная командная тренировка L!S по Dust 2: роли, выходы, ротации и гранаты">
  <link rel="icon" href="data:,">
  <title>Dust 2 · командная тренировка L!S</title>
  <style>
    @font-face { font-family: "Dust Display"; src: url("../../assets/fonts/oswald-cyrillic.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Dust Text"; src: url("../../assets/fonts/inter-cyrillic.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Dust Mono"; src: url("../../assets/fonts/jbmono-cyrillic.woff2") format("woff2"); font-display: swap; }
    :root {
      color-scheme: dark; --bg:#090d0e; --panel:#12191a; --panel2:#182224; --ink:#f3eadc;
      --muted:#b8afa2; --quiet:#7d817e; --line:rgba(241,222,190,.18); --sand:#e7c98f;
      --orange:#ff9a4d; --blue:#62c4ec; --green:#69d59e; --red:#ff6678; --display:"Dust Display",Impact,sans-serif;
      --text:"Dust Text",Arial,sans-serif; --mono:"Dust Mono",monospace;
    }
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden} body{min-width:320px;color:var(--ink);background:
      linear-gradient(120deg,rgba(231,201,143,.03) 1px,transparent 1px) 0 0/32px 32px,
      radial-gradient(800px 500px at 88% -10%,rgba(98,196,236,.14),transparent 65%),
      radial-gradient(900px 600px at -5% 110%,rgba(255,154,77,.12),transparent 65%),var(--bg);font-family:var(--text)}
    button,select{font:inherit} button,a,select{-webkit-tap-highlight-color:transparent} a{color:var(--sand);text-underline-offset:.18em}
    :focus-visible{outline:3px solid var(--sand);outline-offset:3px}.deck{display:grid;grid-template-rows:58px minmax(0,1fr) 56px;width:100vw;height:100dvh;overflow:hidden}
    .deck-header,.deck-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px clamp(16px,3vw,48px);background:rgba(9,13,14,.94);backdrop-filter:blur(12px)}
    .deck-header{border-bottom:1px solid var(--line)}.deck-footer{border-top:1px solid var(--line)}.identity{display:flex;align-items:center;gap:12px;min-width:0}.mark{display:grid;width:38px;height:38px;place-items:center;border:1px solid var(--sand);color:var(--sand);font:700 20px/1 var(--display)}
    .eyebrow{margin:0 0 2px;color:var(--sand);font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.identity strong{display:block;overflow:hidden;font:600 clamp(20px,2.2vw,30px)/.9 var(--display);text-transform:uppercase;text-overflow:ellipsis;white-space:nowrap}
    .head-actions,.foot-actions{display:flex;align-items:center;gap:8px}.control,.jump{min-height:34px;border:1px solid rgba(231,201,143,.38);color:var(--ink);background:var(--panel);font:700 10px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase}.control{padding:8px 11px;cursor:pointer}.control:hover:not(:disabled){border-color:var(--sand);color:var(--sand)}.control:disabled{opacity:.35}.jump{max-width:min(38vw,250px);padding:0 8px}.timer{min-width:64px;color:var(--sand);font:700 15px/1 var(--mono);text-align:center}.slide-stage{min-height:0;overflow:hidden}
    .slide{--accent:var(--sand);display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(10px,1.5vh,18px);width:min(1500px,100%);height:100%;margin:auto;padding:clamp(18px,3vh,34px) clamp(22px,4vw,66px) clamp(14px,2.4vh,28px);overflow:hidden}.slide.t{--accent:var(--orange)}.slide.ct{--accent:var(--blue)}.slide.practice{--accent:var(--green)}.slide.signal{--accent:var(--red)}
    .slide-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:1px solid var(--line);padding-top:5px;padding-bottom:clamp(7px,1vh,11px)}.slide-head p{margin:0 0 4px;color:var(--accent);font:700 clamp(9px,.8vw,12px)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.slide h1,.slide h2,.slide h3{margin:0;font-family:var(--display);font-weight:550;text-transform:uppercase}.slide h1{max-width:12ch;font-size:clamp(56px,8.5vw,126px);line-height:.9}.slide h2{font-size:clamp(31px,3.8vw,62px);line-height:1}.slide h3{color:var(--accent);font-size:clamp(17px,1.65vw,26px);line-height:1}.slide-head__aside{display:flex;align-items:flex-start;justify-content:flex-end;gap:8px;min-width:0}.video-refs{display:flex;justify-content:flex-end;gap:5px;min-width:0}.video-ref{display:grid;grid-template-columns:auto auto;gap:2px 7px;min-width:0;max-width:230px;padding:6px 8px;border:1px solid rgba(255,102,120,.5);color:var(--ink);background:rgba(255,102,120,.08);font:700 9px/1.15 var(--mono);text-decoration:none}.video-ref:hover{border-color:var(--red);background:rgba(255,102,120,.14)}.video-ref__label{color:var(--red);letter-spacing:.06em;text-transform:uppercase}.video-ref__topic{grid-column:1/-1;overflow:hidden;color:var(--muted);font-weight:500;text-overflow:ellipsis;white-space:nowrap}.video-ref__range{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}.timing{flex:0 0 auto;border-left:3px solid var(--accent);padding-left:9px;color:var(--muted);font:700 10px/1.28 var(--mono);text-transform:uppercase}.timing strong{display:block;color:var(--ink);font-size:1.22em}.body{min-height:0;overflow:hidden;font-size:clamp(12px,1.05vw,17px);line-height:1.35}.lead{max-width:58ch;margin:0;color:var(--muted);font-size:clamp(17px,1.65vw,24px);line-height:1.35}.lead strong{color:var(--ink)}.accent{color:var(--accent)}
    .cover-body{display:grid;grid-template-columns:minmax(0,.92fr) minmax(340px,1.08fr);align-items:center;gap:5vw;height:100%}.cover-copy{align-self:center}.cover-copy .lead{margin-top:22px}.cover-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:28px;border:1px solid var(--line);background:var(--line)}.cover-meta div{padding:14px;background:var(--panel)}.cover-meta b{display:block;color:var(--sand);font:600 24px/1 var(--display)}.cover-meta span{display:block;margin-top:5px;color:var(--muted);font-size:11px}.radar-shell{position:relative;width:min(100%,calc((100dvh - 275px)));aspect-ratio:1;margin:auto;overflow:hidden;border:1px solid rgba(231,201,143,.4);background:#050708}.radar-shell img{display:block;width:100%;height:100%;object-fit:contain}.radar-shell::after{position:absolute;right:8px;bottom:6px;content:"РАДАР · CSNADES.GG";color:rgba(255,255,255,.5);font:700 8px/1 var(--mono);letter-spacing:.1em}.cover .radar-shell{box-shadow:20px 24px 0 rgba(231,201,143,.04),0 28px 70px rgba(0,0,0,.5)}
    .grid2,.grid3,.grid4{display:grid;gap:clamp(8px,1.3vw,16px);height:100%;align-content:start}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{min-width:0;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.035),transparent),var(--panel);padding:clamp(11px,1.5vw,20px)}.card .num{display:block;margin-bottom:7px;color:var(--accent);font:600 clamp(26px,3.3vw,48px)/.85 var(--display)}.card p{margin:7px 0 0;color:var(--muted)}.card strong{color:var(--ink)}.card ul,.rules{margin:7px 0 0;padding-left:17px}.card li,.rules li{margin:0 0 5px;color:var(--muted)}.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chip{border:1px solid var(--line);padding:5px 7px;color:var(--muted);background:rgba(0,0,0,.2);font:700 9px/1 var(--mono);text-transform:uppercase}.quote{max-width:19ch;margin:0;color:var(--sand);font:550 clamp(34px,5.3vw,78px)/.93 var(--display);text-transform:uppercase}
    .visual-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.7fr);gap:clamp(12px,2vw,28px);height:100%;min-height:0}.visual-grid .radar-shell{width:min(100%,calc((100dvh - 275px)));align-self:center}.visual-copy{display:grid;gap:8px;align-content:start;min-height:0}.note{border-left:3px solid var(--accent);padding:9px 11px;background:rgba(255,255,255,.035);color:var(--muted)}.note b{display:block;margin-bottom:3px;color:var(--accent);font:700 10px/1 var(--mono);text-transform:uppercase}.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.route{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:10 8;filter:drop-shadow(0 0 4px rgba(0,0,0,.8));vector-effect:non-scaling-stroke}.route.ct{stroke:var(--blue)}.route.t{stroke:var(--orange)}.route.warn{stroke:var(--red)}.route.utility{stroke:var(--green)}
    .map-anchor{stroke:#070a0b;stroke-width:5}.map-plaque{fill:rgba(7,10,11,.93);stroke:var(--sand);stroke-width:2}.map-line--label{fill:none;stroke:var(--sand);stroke-width:2}.map-text{fill:var(--ink);font:700 18px var(--mono);dominant-baseline:middle}.map-pin{fill:var(--accent);stroke:#050708;stroke-width:5}.map-pin__leader{stroke:var(--accent);stroke-width:3}.map-pin__plaque{fill:rgba(5,8,9,.94);stroke:var(--accent);stroke-width:2}.map-pin__label{fill:var(--ink);font:700 16px var(--mono);dominant-baseline:middle}.map-pin__no{fill:#07100f;font:800 15px var(--mono);text-anchor:middle;dominant-baseline:middle}
    .sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid var(--line);background:var(--line)}.sequence .card{border:0;min-height:130px}.sequence h3{font-size:clamp(15px,1.4vw,22px)}.protocol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.protocol .card{border-top:5px solid var(--accent)}.protocol .go{--accent:var(--green)}.protocol .stop{--accent:var(--red)}.protocol .success{--accent:var(--sand)}.protocol h3{font-size:clamp(28px,4vw,56px)}
    .matrix{display:grid;grid-template-columns:1.05fr repeat(3,minmax(0,1fr));border:1px solid var(--line);background:var(--panel)}.matrix>*{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px}.matrix>*:nth-child(4n){border-right:0}.matrix .head{color:var(--accent);background:rgba(255,255,255,.035);font:700 10px/1.2 var(--mono);text-transform:uppercase}.matrix .cue{color:var(--ink);font-weight:700}.matrix span{color:var(--muted)}
    .nade-list{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;height:100%}.nade-card{display:grid;grid-template-columns:28px minmax(130px,.8fr) minmax(240px,1.15fr) 1.35fr auto;align-items:center;gap:9px;min-width:0;border:1px solid var(--line);padding:6px 8px;background:var(--panel)}.nade-no{display:grid;width:28px;height:28px;place-items:center;background:var(--accent);color:#07100f;font:700 13px/1 var(--display)}.nade-card h3{font-size:clamp(13px,1.25vw,19px)}.nade-meta{color:var(--muted);font-size:clamp(9px,.76vw,11px);line-height:1.3}.nade-meta b{color:var(--ink)}.nade-frames{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:0}.nade-frame{position:relative;margin:0;overflow:hidden;border:1px solid var(--line);background:#050708}.nade-frame img{display:block;width:100%;height:48px;object-fit:cover}.nade-frame figcaption{position:absolute;left:3px;bottom:3px;padding:2px 4px;color:#fff;background:rgba(0,0,0,.78);font:700 7px/1 var(--mono);text-transform:uppercase}.nade-link{font:700 9px/1.25 var(--mono);text-transform:uppercase}.pass{display:block;margin-top:4px;color:var(--green)}
    .quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 22px}.quiz div{border-bottom:1px solid var(--line);padding:7px 0;color:var(--muted)}.quiz b{color:var(--accent);margin-right:7px}.quiz small{display:block;margin:3px 0 0 25px;color:var(--green)}
    .progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}.progress span{display:block;width:var(--progress,0%);height:100%;background:var(--sand);transition:width .18s ease}.counter{font:700 12px/1 var(--mono)}.counter span{color:var(--sand)}
    @media(max-height:780px){.deck{grid-template-rows:52px minmax(0,1fr) 50px}.slide{padding-top:13px;padding-bottom:10px;gap:8px}.slide h2{font-size:clamp(27px,3.3vw,48px)}.body{font-size:clamp(11px,.9vw,14px)}.card{padding:9px 11px}.radar-shell,.visual-grid .radar-shell{width:min(100%,calc((100dvh - 220px)))}.nade-card{padding:4px 7px}.nade-frame img{height:39px}.sequence .card{min-height:100px}}
    @media(max-width:900px){.head-actions .control:first-child{display:none}.jump{max-width:33vw}.cover-body,.visual-grid{grid-template-columns:1fr}.cover .radar-shell,.visual-grid .radar-shell{display:none}.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.nade-card{grid-template-columns:26px 1fr 1.3fr auto}.nade-frames{display:none}.video-ref__topic{display:none}.video-ref{display:flex;max-width:none}.video-refs{flex-wrap:wrap}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="deck" data-briefing-minutes="55" data-practice-minutes="55" aria-label="Презентация командной тренировки L!S по Dust 2">
    <header class="deck-header">
      <div class="identity"><span class="mark">D2</span><div><p class="eyebrow">L!S · PLAYBOOK</p><strong id="slide-title">Dust 2</strong></div></div>
      <div class="head-actions"><select class="jump" id="jump-select" aria-label="Выбрать слайд"></select><button class="control" id="fullscreen-button" aria-label="Полноэкранный режим">Экран</button><span class="timer" id="timer-readout">00:00</span><button class="control" id="timer-button" aria-label="Запустить таймер">Старт</button></div>
    </header>
    <div class="slide-stage" id="slide-stage" aria-live="polite"></div>
    <footer class="deck-footer"><div class="counter" id="progress-text"><span>01</span> / 24</div><div class="foot-actions"><button class="control" id="prev-button" aria-label="Предыдущий слайд">Назад</button><button class="control" id="next-button" aria-label="Следующий слайд">Дальше</button></div><div class="eyebrow">← → · HOME · END</div></footer>
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  </main>
  <script>
    const radar = '<div class="radar-shell"><img src="assets/dust2-radar-csnades.webp" alt="Локальный радар Dust 2, источник CSNADES" width="1802" height="1808">';
    const radarEnd = '</div>';
    const note = (title,text) => `<div class="note"><b>${title}</b>${text}</div>`;
    const card = (title,text,num='') => `<article class="card">${num?`<span class="num">${num}</span>`:''}<h3>${title}</h3><p>${text}</p></article>`;
    const routes = (paths) => `<svg class="routes" viewBox="0 0 1000 1000" aria-hidden="true">${paths.map(([c,d])=>`<path class="route ${c}" d="${d}"/>`).join('')}</svg>`;
    const plaqueEdge = (ax,ay,x,y,width,height) => {
      const cx=x+width/2, cy=y+height/2, dx=cx-ax, dy=cy-ay;
      const tx=dx===0?-Infinity:Math.min((x-ax)/dx,(x+width-ax)/dx);
      const ty=dy===0?-Infinity:Math.min((y-ay)/dy,(y+height-ay)/dy);
      const entry=Math.max(tx,ty);
      return {x:ax+dx*entry,y:ay+dy*entry};
    };
    const pins = (items) => `<svg class="routes" viewBox="0 0 1000 1000" aria-label="Роли игроков на радаре">${items.map((p,i)=>{const edge=plaqueEdge(p.x,p.y,p.lx,p.ly-18,p.w,36);return `<g class="role-pin" data-player="${p.player}" data-group="${p.group}"><circle class="map-pin" cx="${p.x}" cy="${p.y}" r="18"/><text class="map-pin__no" x="${p.x}" y="${p.y}">${i+1}</text><line class="map-pin__leader" x1="${p.x}" y1="${p.y}" x2="${edge.x}" y2="${edge.y}"/><rect class="map-pin__plaque" x="${p.lx}" y="${p.ly-18}" width="${p.w}" height="36" rx="4"/><text class="map-pin__label" x="${p.lx+10}" y="${p.ly}">${p.label}</text></g>`}).join('')}</svg>`;
    const callouts = [
      ['Респаун T',500,885,410,930,125],['Респаун CT',657,468,665,500,160],['Лонг',90,300,28,330,95],['Двери лонга',236,432,120,380,155],
      ['Яма',93,431,22,480,74],['КТ',625,350,665,350,55],['Зигзаг',414,337,415,295,100],['Шорт',422,372,455,385,86],
      ['Мид',500,520,520,555,70],['Иксбокс',433,450,330,475,105],['Нижняя тёмка',673,580,545,610,145],['Верхняя тёмка',824,458,820,550,160],
      ['Двери B',658,309,575,290,110],['Окно B',648,240,535,205,105],['Плент A',174,125,55,92,110],['Плент B',827,141,845,95,110]
    ];
    const calloutSvg = `<svg class="routes" id="callout-layer" viewBox="0 0 1000 1000" aria-label="Русские коллауты Dust 2">${callouts.map(([t,x,y,lx,ly,w])=>{const edge=plaqueEdge(x,y,lx,ly-15,w,30);return `<g class="map-label"><circle class="map-anchor" cx="${x}" cy="${y}" r="9" fill="#e7c98f"/><path class="map-line--label" d="M ${x} ${y} L ${edge.x} ${edge.y}"/><rect class="map-plaque" x="${lx}" y="${ly-15}" width="${w}" height="30" rx="3"/><text class="map-text" x="${lx+8}" y="${ly}">${t}</text></g>`}).join('')}</svg>`;

    const nadeData = [
      ['01','Смок иксбокс','L!S / middle','Прыжок + ЛКМ, с места','5/5 в live-прогоне','smokes/xbox-from-t-spawn'],
      ['02','Флешка лонг','D4ba / d0lfero','Прыжок + ЛКМ, с места','5/5 в live-прогоне','flashbangs/a-long-from-outside-long'],
      ['03','Смок кросс A','middle / Reconnecting','Прыжок + ЛКМ, с разбега','3/3 в live-прогоне','smokes/a-cross-from-long-doors-b'],
      ['04','Молотов машина','d0lfero / D4ba','Прыжок + ЛКМ, с места','5/5 в live-прогоне','molotovs/car-from-long-doors'],
      ['05','Смок окно B','Reconnecting / L!S','Прыжок + ЛКМ, с места','5/5 в live-прогоне','smokes/b-window-from-outside-b-tunnels'],
      ['06','Смок двери B','L!S / Reconnecting','Прыжок + ЛКМ, с места','5/5 в live-прогоне','smokes/b-doors-from-outside-b-tunnels'],
      ['07','Флешка плент B','D4ba / d0lfero','ЛКМ с разбега','3/3 в live-прогоне','flashbangs/b-site-from-upper-tunnels-b'],
      ['08','Смок КТ из иксбокса','middle / L!S','ЛКМ, с места','5/5 в live-прогоне','smokes/ct-spawn-from-xbox'],
      ['09','CT-смок нижнего мида','d0lfero / middle','ЛКМ, с места','5/5 в live-прогоне','smokes/bottom-mid-from-ct-mid'],
      ['10','CT-смок тоннелей B','Reconnecting / D4ba','Прыжок + ЛКМ, шагом','5/5 в live-прогоне','smokes/b-tunnels-from-ct-mid']
    ];
    const nadeRows = (start,end) => `<div class="nade-list">${nadeData.slice(start,end).map((n)=>`<article class="nade-card"><span class="nade-no">${n[0]}</span><div><h3>${n[1]}</h3><a class="nade-link" href="https://csnades.gg/dust2/${n[5]}" target="_blank" rel="noreferrer">Открыть CSNADES</a></div><div class="nade-meta"><b>Владелец / резерв:</b> ${n[2]}<br><b>Бросок:</b> ${n[3]}<span class="pass">Критерий: ${n[4]}</span></div><div class="nade-frames"><figure class="nade-frame"><img src="assets/nades/n${n[0]}-position.webp" alt="Видеокадр CSNADES для ${n[1]}" width="1280" height="720"><figcaption>Кадр видео</figcaption></figure><figure class="nade-frame"><img src="assets/nades/n${n[0]}-aim.webp" alt="Точка прицела для ${n[1]}" width="2560" height="1440"><figcaption>Точка прицела</figcaption></figure></div><span class="nade-meta">сдать<br>вдвоём</span></article>`).join('')}</div>`;
    const videoRefMarkup = (refs=[]) => refs.length ? `<div class="video-refs" aria-label="Видеоразбор этого блока">${refs.map((ref)=>`<a class="video-ref" href="https://www.youtube.com/watch?v=${ref.id}&amp;t=${ref.start}s" target="_blank" rel="noopener noreferrer"><span class="video-ref__label">▶ Видео</span><span class="video-ref__range">${ref.range}</span><span class="video-ref__topic">${ref.topic}</span></a>`).join('')}</div>` : '';
    const tPins = pins([
      {player:'L!S',group:'лонг',x:150,y:430,lx:40,ly:365,w:180,label:'L!S · первый лонга'},
      {player:'D4ba',group:'лонг',x:220,y:432,lx:60,ly:475,w:200,label:'D4ba · размен лонга'},
      {player:'d0lfero',group:'мид',x:505,y:610,lx:420,ly:690,w:220,label:'d0lfero · контроль мида'},
      {player:'middle',group:'тёмка',x:780,y:520,lx:700,ly:460,w:220,label:'middle · верхняя тёмка'},
      {player:'Reconnecting',group:'тёмка',x:840,y:570,lx:690,ly:635,w:280,label:'Reconnecting · бомба / связь'}

    const timerButton=document.getElementById('timer-button'),timerReadout=document.getElementById('timer-readout');function showTime(){timerReadout.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
    timerButton.onclick=()=>{ticking=!ticking;timerButton.textContent=ticking?'Пауза':'Старт';timerButton.setAttribute('aria-label',ticking?'Поставить таймер на паузу':'Запустить таймер');timerButton.setAttribute('aria-pressed',String(ticking));if(ticking)timerId=setInterval(()=>{seconds++;showTime()},1000);else clearInterval(timerId)};
    document.getElementById('fullscreen-button').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();render(false);
    window.dust2Deck={goTo:go,slides};
  </script>
</body>
</html>
