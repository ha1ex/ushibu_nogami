<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Интерактивная командная тренировка CS2 по Anubis для команды Ушибу ногами.">
  <title>Anubis · командная тренировка — Ушибу ногами</title>
  <style>
    @font-face { font-family: 'Anubis Display'; src: url('../../assets/fonts/oswald-cyrillic.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Anubis Text'; src: url('../../assets/fonts/inter-cyrillic.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Anubis Mono'; src: url('../../assets/fonts/jbmono-cyrillic.woff2') format('woff2'); font-display: swap; }

    :root {
      color-scheme: dark;
      --ink: #f5eee5;
      --muted: #b8ad9e;
      --quiet: #80766c;
      --night: #0c1111;
      --night-2: #111a19;
      --stone: #1a2521;
      --line: rgba(232, 211, 168, .20);
      --line-strong: rgba(232, 211, 168, .46);
      --sand: #e8d3a8;
      --sun: #f7b94e;
      --t: #ffae45;
      --ct: #55b9ed;
      --signal: #ff5c7c;
      --success: #63d6a1;
      --focus: #f7d36b;
      --display: 'Anubis Display', Impact, sans-serif;
      --text: 'Anubis Text', Arial, sans-serif;
      --mono: 'Anubis Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; overflow-x: clip; background: var(--night); }
    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      overflow-x: clip;
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 90% -12%, rgba(77, 146, 135, .19), transparent 62%),
        radial-gradient(700px 500px at -8% 110%, rgba(220, 160, 68, .13), transparent 65%),
        linear-gradient(125deg, rgba(232, 211, 168, .025) 0 1px, transparent 1px 20px),
        linear-gradient(35deg, rgba(232, 211, 168, .018) 0 1px, transparent 1px 24px),
        var(--night);
      font-family: var(--text);
    }
    button, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    a { color: var(--sand); }
    .skip-link { position: fixed; z-index: 10; top: 8px; left: 8px; padding: 8px 12px; transform: translateY(-160%); background: var(--sand); color: var(--night); font-weight: 700; }
    .skip-link:focus { transform: translateY(0); }

    .deck {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100dvh;
      min-height: 0;
      isolation: isolate;
    }
    .deck-header, .deck-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(10px, 2vw, 24px);
      padding: 10px clamp(14px, 3vw, 42px);
      border-color: var(--line);
      background: rgba(12, 17, 17, .92);
      backdrop-filter: blur(12px);
    }
    .deck-header { position: sticky; top: 0; z-index: 3; border-bottom: 1px solid var(--line); }
    .deck-footer { z-index: 3; border-top: 1px solid var(--line); }
    .identity { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .cartouche { display: grid; width: 36px; height: 36px; flex: 0 0 auto; place-items: center; border: 1px solid var(--sand); color: var(--sand); font-family: var(--display); font-size: 21px; line-height: 1; }
    .eyebrow { margin: 0 0 3px; color: var(--sand); font-family: var(--mono); font-size: clamp(9px, 1vw, 11px); letter-spacing: .11em; text-transform: uppercase; }
    .identity strong { display: block; overflow: hidden; font-family: var(--display); font-size: clamp(20px, 2.3vw, 30px); font-weight: 500; line-height: .9; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .header-actions, .footer-actions { display: flex; align-items: center; gap: 8px; }
    .timer-readout { min-width: 66px; color: var(--sand); font-family: var(--mono); font-size: clamp(13px, 1.7vw, 18px); text-align: right; font-variant-numeric: tabular-nums; }
    .ui-button, .jump-select {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      color: var(--ink);
      background: rgba(26, 37, 33, .9);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .ui-button { padding: 8px 11px; cursor: pointer; }
    .ui-button:hover:not(:disabled) { border-color: var(--sand); color: var(--sand); background: rgba(232, 211, 168, .11); }
    .ui-button:disabled { cursor: not-allowed; opacity: .42; }
    .ui-button--timer { min-width: 62px; border-color: rgba(247, 185, 78, .72); color: var(--sun); }
    .ui-button--next { border-color: var(--sand); color: var(--night); background: var(--sand); font-weight: 700; }
    .ui-button--next:hover:not(:disabled) { color: var(--night); background: #fff0cf; }
    .jump-select { max-width: min(42vw, 260px); padding: 0 8px; cursor: pointer; }

    .deck-main { min-height: 0; overflow: auto; }
    .slide {
      width: min(1440px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: clamp(22px, 4vw, 58px) clamp(16px, 4vw, 68px) clamp(26px, 4vw, 52px);
    }
    .slide__meta { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: clamp(12px, 2vw, 24px); color: var(--quiet); font-family: var(--mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
    .slide__tag { display: inline-flex; align-items: center; gap: 7px; color: var(--sand); }
    .slide__tag::before { width: 7px; height: 7px; content: ''; background: currentColor; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
    .slide__time { color: var(--quiet); white-space: nowrap; }
    .slide h1, .slide h2, .slide h3, .slide p { max-width: 100%; }
    .slide h1, .slide h2 { margin: 0; font-family: var(--display); font-weight: 500; letter-spacing: .01em; text-transform: uppercase; }
    .slide h1 { max-width: 18ch; font-size: clamp(42px, 8.4vw, 112px); line-height: .86; }
    .slide h2 { max-width: 21ch; font-size: clamp(34px, 4vw, 68px); line-height: .91; }
    .slide h3 { margin: 0; font-family: var(--display); font-size: clamp(20px, 2.5vw, 31px); font-weight: 500; line-height: 1; text-transform: uppercase; }
    .lead { max-width: 71ch; margin: clamp(14px, 2vw, 24px) 0 0; color: var(--muted); font-size: clamp(16px, 1.6vw, 21px); line-height: 1.48; }
    .lead strong { color: var(--ink); }
    .rule { width: min(100%, 920px); height: 1px; margin: clamp(19px, 3vw, 32px) 0; background: linear-gradient(90deg, var(--sand), transparent); }
    .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, .95fr); gap: clamp(22px, 4vw, 65px); align-items: start; }
    .columns--visual { align-items: center; }
    .columns--wide { grid-template-columns: minmax(0, .78fr) minmax(420px, 1.22fr); }
    .stack { display: grid; gap: 12px; }
    .panel {
      min-width: 0;
      padding: clamp(14px, 2vw, 22px);
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(232, 211, 168, .055), rgba(17, 26, 25, .72));
    }
    .panel--t { border-left: 3px solid var(--t); }
    .panel--ct { border-left: 3px solid var(--ct); }
    .panel--signal { border-left: 3px solid var(--signal); }
    .panel__kicker { margin: 0 0 7px; color: var(--quiet); font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
    .panel p { margin: 0; color: var(--muted); font-size: clamp(13px, 1.35vw, 17px); line-height: 1.42; }
    .panel p + p { margin-top: 9px; }
    .panel strong { color: var(--ink); }
    .fact-note { margin-top: 13px; padding: 10px 12px; border-left: 2px solid var(--ct); color: var(--muted); background: rgba(85, 185, 237, .07); font-family: var(--mono); font-size: 11px; line-height: 1.45; }
    .coach-note { margin-top: 13px; padding: 10px 12px; border-left: 2px solid var(--sun); color: var(--muted); background: rgba(247, 185, 78, .07); font-family: var(--mono); font-size: 11px; line-height: 1.45; }
    .coach-note b, .fact-note b { color: var(--sand); }
    .video-strip {
      display: grid;
      grid-template-columns: minmax(170px, .38fr) minmax(0, .62fr);
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      padding: 8px 10px;
      border-top: 2px solid var(--sand);
      border-bottom: 1px solid var(--line);
      background: rgba(232, 211, 168, .045);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.35;
    }
    .video-strip a, .video-strip strong { color: var(--sand); font-weight: 800; text-transform: uppercase; }
    .video-strip span { color: var(--muted); }
    .video-strip--exception { border-top-color: var(--quiet); background: rgba(128, 118, 108, .05); }
    .video-strip--exception strong { color: var(--quiet); }
    .number-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-top: clamp(18px, 3vw, 35px); background: var(--line); border: 1px solid var(--line); }
    .number-card { min-width: 0; padding: clamp(14px, 2vw, 24px); background: var(--night-2); }
    .number-card b { display: block; color: var(--sand); font-family: var(--display); font-size: clamp(36px, 5vw, 60px); font-weight: 500; line-height: .86; }
    .number-card span { display: block; margin-top: 7px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .number-card em { display: block; margin-top: 5px; color: var(--quiet); font-family: var(--mono); font-size: 10px; font-style: normal; line-height: 1.35; text-transform: uppercase; }
    .role-list, .check-list, .source-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .role-list li, .check-list li, .source-list li { position: relative; padding-left: 22px; color: var(--muted); font-size: clamp(13px, 1.35vw, 17px); line-height: 1.4; }
    .role-list li::before, .check-list li::before, .source-list li::before { position: absolute; left: 0; color: var(--sand); font-family: var(--mono); content: '→'; }
    .role-list b, .check-list b, .source-list b { color: var(--ink); }
    .call { color: var(--sand); font-family: var(--mono); font-size: .86em; }
    .call--signal { color: var(--signal); }
    .call--success { color: var(--success); }
    .call--t { color: var(--t); }
    .call--ct { color: var(--ct); }
    .mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .mini-grid--three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mini-card { min-width: 0; padding: 13px; border: 1px solid var(--line); background: rgba(17, 26, 25, .77); }
    .mini-card b { display: block; color: var(--sand); font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    .mini-card span { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-top: 22px; background: var(--line); border: 1px solid var(--line); }
    .flow__step { min-width: 0; min-height: 115px; padding: 15px; background: var(--night-2); }
    .flow__step b { display: block; color: var(--sand); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .flow__step p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .flow__step--stop b { color: var(--signal); }
    .flow__step--success b { color: var(--success); }

    .visual { display: grid; gap: 8px; min-width: 0; }
    .visual-frame { position: relative; width: min(100%, 780px); margin-inline: auto; overflow: hidden; border: 1px solid var(--line-strong); background: #050808; }
    .visual-frame--radar { width: min(100%, 62dvh); aspect-ratio: 1; }
    .visual-frame--photo { width: min(100%, 88dvh); aspect-ratio: 16 / 9; }
    .columns--wide .visual-frame--radar { width: min(100%, 70dvh); }
    .visual-frame img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
    .visual-frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .visual-caption { display: flex; justify-content: space-between; gap: 12px; color: var(--quiet); font-family: var(--mono); font-size: 10px; line-height: 1.35; }
    .visual-caption span:last-child { text-align: right; }
    .map-line { fill: none; stroke: rgba(245, 238, 229, .96); stroke-width: 2.8; vector-effect: non-scaling-stroke; }
    .map-line--t { stroke: var(--t); }
    .map-line--ct { stroke: var(--ct); }
    .map-line--signal { stroke: var(--signal); }
    .map-anchor { stroke: var(--night); stroke-width: 3; vector-effect: non-scaling-stroke; }
    .map-anchor--neutral { fill: var(--sand); }
    .map-anchor--t { fill: var(--t); }
    .map-anchor--ct { fill: var(--ct); }
    .map-anchor--signal { fill: var(--signal); }
    .map-plaque { stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .map-plaque--neutral { fill: rgba(12, 17, 17, .91); stroke: var(--sand); }
    .map-plaque--t { fill: rgba(32, 21, 8, .95); stroke: var(--t); }
    .map-plaque--ct { fill: rgba(7, 29, 40, .95); stroke: var(--ct); }
    .map-plaque--signal { fill: rgba(47, 12, 20, .96); stroke: var(--signal); }
    .map-text { fill: var(--ink); font-family: var(--mono); font-size: 17px; font-weight: 800; letter-spacing: .015em; }
    .map-pin { stroke: var(--night); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .map-pin--t { fill: var(--t); }
    .map-pin--ct { fill: var(--ct); }
    .map-pin__text { fill: var(--night); font-family: var(--mono); font-size: 13px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .map-pin__label { fill: var(--ink); paint-order: stroke; stroke: rgba(5, 8, 8, .95); stroke-width: 4px; stroke-linejoin: round; font-family: var(--mono); font-size: 14px; font-weight: 800; text-anchor: middle; }
    .map-pin__leader { fill: none; stroke: rgba(245, 238, 229, .8); stroke-width: 1.75; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
    .map-pin__plaque { fill: rgba(5, 8, 8, .9); stroke: rgba(232, 211, 168, .6); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .radar-legend { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 8px; color: var(--quiet); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
    .radar-legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: -1px; background: var(--sand); }
    .radar-legend .legend--t i { background: var(--t); }
    .radar-legend .legend--ct i { background: var(--ct); }
    .radar-legend .legend--signal i { background: var(--signal); }

    .cover { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(300px, .94fr); gap: clamp(25px, 6vw, 86px); align-items: end; min-height: min(710px, calc(100dvh - 125px)); }
    .cover__code { display: flex; flex-wrap: wrap; gap: 8px; margin-top: clamp(19px, 3vw, 30px); }
    .token { padding: 5px 7px; border: 1px solid var(--line); color: var(--muted); background: rgba(17, 26, 25, .7); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
    .cover__right { display: grid; gap: 12px; align-content: end; }
    .cover-map { position: relative; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--line-strong); background: radial-gradient(circle at 53% 52%, rgba(232, 211, 168, .18), transparent 52%), #070a0a; }
    .cover-map img { display: block; width: 100%; height: 100%; object-fit: contain; filter: saturate(.76) contrast(1.1); opacity: .83; }
    .cover-map::after { position: absolute; inset: 0; content: ''; background: linear-gradient(135deg, rgba(247, 185, 78, .15), transparent 38%, rgba(85, 185, 237, .13)); mix-blend-mode: screen; pointer-events: none; }
    .cover-signal { padding: 14px 16px; border-left: 3px solid var(--signal); color: var(--muted); background: rgba(255, 92, 124, .08); font-size: 14px; line-height: 1.4; }
    .cover-signal b { color: var(--ink); }
    .big-quote { margin: 0; color: var(--sand); font-family: var(--display); font-size: clamp(29px, 4.2vw, 58px); line-height: .95; text-transform: uppercase; }

    .nade-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: clamp(18px, 3vw, 30px); }
    .nade-card { min-width: 0; padding: 14px; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(232, 211, 168, .055), rgba(17, 26, 25, .85)); }
    .nade-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .nade-card h3 { max-width: 24ch; font-size: clamp(18px, 2.1vw, 26px); }
    .side { flex: 0 0 auto; padding: 4px 5px; border: 1px solid currentColor; font-family: var(--mono); font-size: 10px; font-weight: 800; }
    .side--t { color: var(--t); }
    .side--ct { color: var(--ct); }
    .status { display: inline-block; margin-top: 8px; color: var(--signal); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
    .nade-card__use { margin: 8px 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .nade-frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin: 10px 0; }
    .nade-frame { min-width: 0; margin: 0; border: 1px solid rgba(232, 211, 168, .22); background: #050808; }
    .nade-frame img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #050808; }
    .nade-frame figcaption { padding: 5px 6px; border-top: 1px solid rgba(232, 211, 168, .16); color: var(--quiet); font-family: var(--mono); font-size: 9px; letter-spacing: .03em; text-transform: uppercase; }
    .nade-data { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 11px; margin: 0; }
    .nade-data div { min-width: 0; padding-top: 5px; border-top: 1px solid rgba(232, 211, 168, .12); }
    .nade-data dt { color: var(--quiet); font-family: var(--mono); font-size: 9px; letter-spacing: .05em; text-transform: uppercase; }
    .nade-data dd { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.3; }
    .nade-data dd strong { color: var(--ink); }
    .nade-link { display: inline-block; margin-top: 10px; color: var(--sand); font-family: var(--mono); font-size: 11px; }
    .candidate-warning { margin-top: 11px; padding: 9px 11px; border: 1px solid rgba(255, 92, 124, .37); color: var(--muted); background: rgba(255, 92, 124, .07); font-family: var(--mono); font-size: 10px; line-height: 1.42; }
    .candidate-warning b { color: var(--signal); }

    .timeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-top: clamp(18px, 3vw, 30px); background: var(--line); border: 1px solid var(--line); }
    .timeline__item { min-width: 0; padding: 15px; background: var(--night-2); }
    .timeline__item b { display: block; color: var(--sand); font-family: var(--display); font-size: 28px; font-weight: 500; line-height: .9; }
    .timeline__item span { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .timeline__item small { display: block; margin-top: 6px; color: var(--quiet); font-family: var(--mono); font-size: 10px; }
    .source-panel { margin-top: clamp(18px, 3vw, 32px); padding: clamp(16px, 2vw, 24px); border: 1px solid var(--line-strong); background: rgba(17, 26, 25, .82); }
    .source-panel h3 { color: var(--sand); }
    .source-panel p { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .source-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .source-links a { padding: 7px 8px; border: 1px solid var(--line); background: var(--night); color: var(--sand); font-family: var(--mono); font-size: 10px; text-decoration: none; text-transform: uppercase; }
    .source-links a:hover { border-color: var(--sand); }
    .footer-progress { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .progress-text { min-width: 48px; color: var(--sand); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
    .progress-bar { width: min(20vw, 220px); height: 4px; overflow: hidden; background: rgba(232, 211, 168, .16); }
    .progress-bar i { display: block; width: var(--progress, 0%); height: 100%; background: linear-gradient(90deg, var(--sun), var(--sand)); transition: width .2s ease; }
    .keyboard-hint { color: var(--quiet); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 900px) {
      .columns, .columns--wide, .cover { grid-template-columns: 1fr; }
      .cover { min-height: 0; }
      .cover__right { max-width: 680px; }
      .columns--visual > .visual { order: -1; }
      .timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .number-grid { grid-template-columns: 1fr; }
      .number-card { display: grid; grid-template-columns: 90px minmax(0, 1fr); column-gap: 14px; align-items: center; }
      .number-card b { grid-row: span 2; }
      .number-card span, .number-card em { margin-top: 0; }
    }
    @media (max-width: 680px) {
      .deck-header { align-items: flex-start; }
      .header-actions .ui-button:not(.ui-button--timer) { display: none; }
      .deck-footer { flex-wrap: wrap; }
      .footer-actions { margin-left: auto; }
      .jump-select { width: min(52vw, 230px); }
      .nade-grid, .nade-frames, .mini-grid, .mini-grid--three, .flow { grid-template-columns: 1fr; }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
        });
      }

      function videoStrip(url, label, range, note) {
        return '<div class="video-strip" data-video-kind="clip">' +
          '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Видео · ' + esc(label) + ', ' + esc(range) + '</a>' +
          '<span>' + esc(note) + '</span>' +
        '</div>';
      }

      function scaled(value, height) { return Math.round(Number(value) * (height || 1000)); }

      function plaqueWidth(label) {
        return Math.min(400, Math.max(108, 26 + String(label).length * 11));
      }

      function leaderEnd(ax, ay, left, top, width, height) {
        var cx = left + width / 2;
        var cy = top + height / 2;
        var dx = ax - cx;
        var dy = ay - cy;
        if (!dx && !dy) return [cx, cy];
        var scale = Math.min(dx ? width / 2 / Math.abs(dx) : Infinity, dy ? height / 2 / Math.abs(dy) : Infinity);
        return [Math.round(cx + dx * scale), Math.round(cy + dy * scale)];
      }

      function visualLabel(label, height) {
        var x = scaled(label.u);
        var y = scaled(label.v, height);
        var tx = scaled(label.tx);
        var ty = scaled(label.ty, height);
        var width = plaqueWidth(label.label);
        var px = Math.max(6, Math.min(994 - width, tx - width / 2));
        var py = Math.max(24, Math.min(height - 44, ty - 19));
        var tone = esc(label.tone || 'neutral');
        var end = leaderEnd(x, y, px, py, width, 38);
        return '' +
          '<g class="map-label" data-point="' + esc(label.id) + '" data-plaque-center="' + Math.round(tx) + '">' +
            '<path class="map-line map-line--label map-line--' + tone + '" d="M ' + x + ' ' + y + ' L ' + end[0] + ' ' + end[1] + '"></path>' +
            '<circle class="map-anchor map-anchor--' + tone + '" cx="' + x + '" cy="' + y + '" r="8"></circle>' +
            '<rect class="map-plaque map-plaque--' + tone + '" data-min-width="' + width + '" x="' + Math.round(px) + '" y="' + Math.round(py) + '" width="' + width + '" height="38"></rect>' +
            '<text class="map-text" x="' + Math.round(px + 12) + '" y="' + Math.round(py + 25) + '">' + esc(label.label) + '</text>' +
          '</g>';
      }

      function visualRoute(item, height) {
        if (!item.points || item.points.length < 2) return '';
        var coords = item.points.map(function (p) { return scaled(p[0]) + ',' + scaled(p[1], height); }).join(' ');
        var tone = esc(item.tone || 't');
        return '<polyline class="map-line map-route map-line--' + tone + '" marker-end="url(#arrow-' + tone + ')" points="' + coords + '"></polyline>';
      }

      function fitMapLabels() {
        Array.prototype.forEach.call(slideRoot.querySelectorAll('.map-label'), function (group) {
          var plaque = group.querySelector('.map-plaque');
          var text = group.querySelector('.map-text');
          if (!plaque || !text) return;
          var textWidth = 0;
          try { textWidth = text.getComputedTextLength(); } catch (error) { textWidth = 0; }
          var width = Math.min(988, Math.max(Number(plaque.getAttribute('data-min-width')) || 0, Math.ceil(textWidth + 24)));
          var center = Number(group.getAttribute('data-plaque-center'));
          var left = Math.max(6, Math.min(994 - width, center - width / 2));
          var anchor = group.querySelector('.map-anchor');
          var leader = group.querySelector('.map-line--label');
          var top = Number(plaque.getAttribute('y'));
          var end = leaderEnd(Number(anchor.getAttribute('cx')), Number(anchor.getAttribute('cy')), left, top, width, Number(plaque.getAttribute('height')));
          plaque.setAttribute('x', String(Math.round(left)));
          plaque.setAttribute('width', String(Math.round(width)));
          text.setAttribute('x', String(Math.round(left + 12)));
          leader.setAttribute('d', 'M ' + anchor.getAttribute('cx') + ' ' + anchor.getAttribute('cy') + ' L ' + end[0] + ' ' + end[1]);
        });
      }

      function visualPin(pin, index, tone, height) {
        var x = scaled(pin.u);
        var y = scaled(pin.v, height);
        var labelX = pin.lu == null ? x : scaled(pin.lu);
        var labelY = pin.lv == null ? y + 33 : scaled(pin.lv, height);
        var labelAnchor = /^(start|middle|end)$/.test(pin.anchor || '') ? pin.anchor : 'middle';

        var labelLeft = labelAnchor === 'start' ? labelX - 8 : labelAnchor === 'end' ? labelX - labelWidth + 8 : labelX - labelWidth / 2;

        labelX = labelAnchor === 'start' ? labelLeft + 8 : labelAnchor === 'end' ? labelLeft + labelWidth - 8 : labelLeft + labelWidth / 2;
        var labelTop = Math.max(6, Math.min(height - 33, labelY - 19));
        labelY = labelTop + 19;
        var end = leaderEnd(x, y, labelLeft, labelTop, labelWidth, 27);
        var n = esc(pin.n || String(index + 1));

            '<text class="map-pin__label" x="' + labelX + '" y="' + labelY + '" style="text-anchor:' + labelAnchor + '">' + esc(pin.label || '') + '</text>' +

      function defs() {

      function renderScene(scene) {
        var image = scene.image || scenes.radar.image;

                '<div><h2 id="slide-title-17">B: колонна — конкретный угол</h2><p class="lead">На кадре линия приходит к видимой центральной колонне. В раунде колл <span class="call">«колонна»</span> не означает весь сайт и не заменяет число соперников.</p>' +
                videoStrip('https://www.youtube.com/watch?v=588UtJa98F0&t=147s', 'Видео · пакет B', '2:27–3:31', 'Показаны ориентиры и гранаты B; точный словарный колл «колонна» проверяется по радару и кадру.') +
                '<div class="fact-note"><b>Проверка формулировки:</b> каждый называет «сайт B», «колонна», «дальний B» отдельно. Если нужна другая точка — называем её целиком, не сокращаем до «там B».</div></div>' +
                renderScene(scenes.photos.b) +
              '</div>';
          }
        },
        {
          short: 'CT реакция', kicker: '18 · CT', minutes: '03 мин',
          render: function () {
            return '' +
              '<div class="columns columns--wide columns--visual">' +
                '<div><h2 id="slide-title-18">CT: три триггера, один язык</h2><p class="lead">Мид/вода, мейн A и мейн B не требуют трёх разных паник. Везде сначала точка + число + действие, затем только подтверждённая ротация.</p>' +
                videoStrip('https://www.youtube.com/watch?v=AjvPl3qamwE&t=205s', 'ротация с B', '3:25–3:42', 'Короткий пример подтверждённой ротации; триггеры и формулировки на слайде — протокол команды.') +
                '<div class="flow"><div class="flow__step"><b>Мид / вода</b><p><span class="call">«Мид, два, падаю CT»</span>. Опорник A держит, ретейк — только втроём и с гранатами.</p></div><div class="flow__step"><b>Мейн A</b><p><span class="call">«Мейн A, два, хевен держит»</span>. Мид подключается лишь на гранаты/полный вход; B остаётся с опорником.</p></div><div class="flow__step"><b>Мейн B</b><p><span class="call">«Мейн B, два+, опорник жив»</span>. Мид/Е-бокс тормозит, A не бросает сайт; CT-смок N-09 пока кандидат.</p></div></div><div class="coach-note"><b>СТОП:</b> одиночный шум не вызывает полную ротацию. <b>УСПЕХ:</b> ретейк начинается только с людьми, гранатами и общим входом.</div></div>' +
                renderScene(scenes.ctReaction) +
              '</div>';
          }
        },
        {
          short: 'CT ретейк', kicker: '19 · CT', minutes: '03 мин',
          render: function () {
            return '' +
              '<h2 id="slide-title-19">CT ретейк: один флеш — один шаг</h2><p class="lead">В ретейке не «проверяем» по очереди. Первый называет выход, второй даёт флеш, третий входит на её счёт. Если смока / флешки нет — команда это говорит, а не притворяется готовой.</p>' +
              videoStrip('https://www.youtube.com/watch?v=AjvPl3qamwE&t=205s', 'Видео · ротация B', '3:25–3:42', 'Фрагмент показывает принцип ротации и сбора; сам трёхшаговый ретейк — командный протокол, а N-08 требует live-прогона.') +
              '<div class="mini-grid mini-grid--three" style="margin-top:22px"><div class="mini-card"><b>D4ba · капитан</b><span><span class="call call--ct">«Трое живы. Хевен + CT. Флеш через два.»</span></span></div><div class="mini-card"><b>Reconnecting · гранаты</b><span><span class="call call--ct">«Флеш готова. Бросаю.»</span></span></div><div class="mini-card"><b>L!S · вход</b><span><span class="call call--success">«Пошли после вспышки.»</span></span></div></div>' +
              '<div class="candidate-warning"><b>Граната N-08:</b> флеш воды с хевена показана ниже как прямой кандидат CSNADES. Она не принята в обязательные, пока команда не сохранит текущий старт, прицел и результат броска.</div>';
          }
        },
        {
          short: 'Гранаты 1–4', kicker: '20 · гранаты', minutes: '03 мин',
          render: function () {
            return '' +
              '<h2 id="slide-title-20">Раскидки 1–4: источник есть, принятого броска пока нет</h2><p class="lead">У каждой карточки есть назначение, владелец, резерв, опубликованный способ броска, локальные кадры позиции и прицела из источника и прямая ссылка. Эти кадры — ориентир, а не подтверждение текущего клиента.</p>' +
              nadeCards(0, 4) +
              '<div class="candidate-warning"><b>Как принять гранату:</b> открыть ссылку → бросить в текущем билде → сопоставить с локальными кадрами и записать дату/билд, стартовый объект, close-up прицела и наблюдаемый результат. До этого карточка остаётся кандидатом.</div>';
          }
        },
        {
          short: 'Гранаты 5–10', kicker: '21 · гранаты', minutes: '04 мин',
          render: function () {
            return '' +
              '<div class="columns columns--wide columns--visual">' +
              '<div><h2 id="slide-title-21">Раскидки 5–10: B и ответ CT</h2><p class="lead">Особенно осторожно с Е-боксом и дальним B: Valve меняла близкую геометрию и коллизии. N-09 тормозит быстрый мейн B, N-10 перекрывает мост; свежая дата страницы всё равно не заменяет бросок на нашем сервере.</p><div class="candidate-warning"><b>Нельзя называть обязательными:</b> ни одна из десяти раскидок не прошла локальную проверку текущего билда в рамках этой работы.</div></div>' +
                renderScene(scenes.nadeBoard) +
              '</div>' +
              nadeCards(4, 10);
          }
        },
        {
          short: 'Домашняя работа', kicker: '22 · закрепление', minutes: '02 мин',
          render: function () {
            return '' +
              '<h2 id="slide-title-22">27 минут личной практики, потом — только подтверждённые ответы</h2><p class="lead">Это потолок индивидуального блока. Цель — не выучить картинку, а вернуть команде проверяемую запись: что бросил, откуда, как целился и что получилось.</p>' +
              '<div class="timeline"><div class="timeline__item"><b>06 мин</b><span>Пройти коллы: вода, мост, двери мида, спуск, мейны A/B, Е-бокс, дальний B, колонна.</span><small>голосом</small></div><div class="timeline__item"><b>09 мин</b><span>Выбрать 2 карточки гранат и повторить до стабильного результата.</span><small>без статуса «обязательная»</small></div><div class="timeline__item"><b>07 мин</b><span>Сделать короткий ролик / скрин старта и крупного прицела для каждой удачной.</span><small>только текущий билд</small></div><div class="timeline__item"><b>05 мин</b><span>Написать D4ba: роль, резерв, момент, критерий успеха или причину брака.</span><small>одна строка на гранату</small></div></div>' +
              '<section aria-labelledby="final-test-title"><h3 id="final-test-title" style="margin-top:18px">Финальный тест · 8 вопросов</h3><div class="mini-grid" style="margin-top:12px"><div class="mini-card"><b>Вопрос 1</b><span>Назови пять зон дефолта CT и правило начала ротации.</span></div><div class="mini-card"><b>Вопрос 2</b><span>Почему нельзя говорить просто «коннектор»? Какие уточнения допустимы?</span></div><div class="mini-card"><b>Вопрос 3</b><span>Где первая и вторая точки решения дефолта T?</span></div><div class="mini-card"><b>Вопрос 4</b><span>Дай короткий колл и первое действие для мида/воды, мейна A или мейна B.</span></div><div class="mini-card"><b>Вопрос 5</b><span>Кто на A — энтри, размен, бомба, гранаты и фланг? Кто говорит «ВХОД»?</span></div><div class="mini-card"><b>Вопрос 6</b><span>Назови условия «СТОП» для выхода A через мейн + воду.</span></div><div class="mini-card"><b>Вопрос 7</b><span>Что должно быть готово, прежде чем мейн B начинает вход?</span></div><div class="mini-card"><b>Вопрос 8</b><span>Когда раскидку-кандидат можно сделать обязательной и что нужно записать?</span></div></div></section>' +
              '<section class="source-panel"><h3>Где заканчивается факт</h3><p>Реестр разделяет Valve-изменения, справочные коллы, внешние тактические материалы и тренерские решения. В нём же — полный список прямых ссылок, локальных кадров и статусов гранат.</p><div class="source-links"><a href="SOURCE_LEDGER.md" target="_blank">Открыть реестр источников</a><a href="LABEL_AUDIT.md" target="_blank">Открыть аудит подписей</a><a href="NADES_SOURCE_ASSETS.md" target="_blank">Открыть кадры гранат</a><a href="https://steamcommunity.com/app/730/announcements" target="_blank" rel="noopener noreferrer">Valve announcements ↗</a><a href="https://csdb.gg/maps/anubis/" target="_blank" rel="noopener noreferrer">CSDB callouts ↗</a></div></section>';
          }
        }
      ];

      function currentSlideFromQuery() {
        var value = Number(new URLSearchParams(window.location.search).get('slide'));
        return value >= 1 && value <= slides.length ? value - 1 : 0;
      }

      function render(index, moveFocus) {
        activeIndex = Math.max(0, Math.min(slides.length - 1, index));
        var slide = slides[activeIndex];
        slideRoot.innerHTML = slideMarkup(slide);
        fitMapLabels();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMapLabels);
        previousButton.disabled = activeIndex === 0;
        nextButton.disabled = activeIndex === slides.length - 1;
        progressText.textContent = String(activeIndex + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
        progressBar.style.setProperty('--progress', ((activeIndex + 1) / slides.length * 100) + '%');
        jumpSelect.value = String(activeIndex);
        document.title = (activeIndex + 1) + '. ' + slide.short + ' · Anubis — Ушибу ногами';
        try {
          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('slide', String(activeIndex + 1));
          window.history.replaceState({ slide: activeIndex + 1 }, '', nextUrl);
        } catch (error) {
          /* file:// preview may deny history replacement; navigation still works. */
        }
        deckMain.scrollTop = 0;
        if (moveFocus) document.getElementById('slide-content').focus({ preventScroll: true });
        var nextVisual = slideRoot.querySelector('[data-next-visual]');
        if (nextVisual) nextVisual.addEventListener('click', function () { render(activeIndex + 1, true); });
      }

      function go(delta) { render(activeIndex + delta, true); }

      function formatTimer(milliseconds) {
        var seconds = Math.floor(milliseconds / 1000);
        var minutes = Math.floor(seconds / 60);
        return String(minutes).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
      }

      function drawTimer() {
        var elapsed = timerOffset + (timerStartedAt ? Date.now() - timerStartedAt : 0);
        timerReadout.textContent = formatTimer(elapsed);
      }

      function toggleTimer() {
        if (timerStartedAt) {
          timerOffset += Date.now() - timerStartedAt;
          timerStartedAt = 0;
          clearInterval(timerInterval);
          timerInterval = null;
          timerButton.textContent = 'Старт';
          timerButton.setAttribute('aria-pressed', 'false');
          drawTimer();
          return;
        }
        timerStartedAt = Date.now();
        timerInterval = window.setInterval(drawTimer, 250);
        timerButton.textContent = 'Пауза';
        timerButton.setAttribute('aria-pressed', 'true');
        drawTimer();
      }

      function updateFullscreenButton() {
        fullscreenButton.textContent = document.fullscreenElement ? 'Обычный режим' : 'Полный экран';
      }

      function toggleFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        }
      }

      slides.forEach(function (slide, index) {
        var option = document.createElement('option');
        option.value = String(index);
        option.textContent = String(index + 1).padStart(2, '0') + ' · ' + slide.short;
        jumpSelect.appendChild(option);
      });

      previousButton.addEventListener('click', function () { go(-1); });
      nextButton.addEventListener('click', function () { go(1); });
      jumpSelect.addEventListener('change', function () { render(Number(jumpSelect.value), true); });
      timerButton.addEventListener('click', toggleTimer);
      fullscreenButton.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('keydown', function (event) {
        var target = event.target;
        var isFormControl = target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName);
        if (event.key === 'Escape' && document.fullscreenElement) {
          event.preventDefault();
          document.exitFullscreen();
          return;
        }
        if (isFormControl) return;
        if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); go(1); }
        else if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); go(-1); }
        else if (event.key === 'Home') { event.preventDefault(); render(0, true); }
        else if (event.key === 'End') { event.preventDefault(); render(slides.length - 1, true); }
        else if (event.key.toLowerCase() === 'f') { event.preventDefault(); toggleFullscreen(); }
      });

      window.addEventListener('popstate', function () { render(currentSlideFromQuery(), false); });

      render(currentSlideFromQuery(), false);
      drawTimer();
      updateFullscreenButton();
    })();
  </script>
</body>
