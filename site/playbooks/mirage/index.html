      ].map(function (nade, index) {
        var n = String(index + 1).padStart(2,'0');

      function esc(value) { return String(value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
      function scaled(value) { return Math.round(Number(value) * 1000); }
      function plaqueWidth(label) { return Math.min(330, Math.max(92, 24 + String(label).length * 10)); }
      function leaderEnd(ax,ay,left,top,width,height) {
        var cx=left+width/2, cy=top+height/2, dx=ax-cx, dy=ay-cy;
        if(!dx&&!dy)return [cx,cy];
        var scale=Math.min(dx?width/2/Math.abs(dx):Infinity,dy?height/2/Math.abs(dy):Infinity);
        return [Math.round(cx+dx*scale),Math.round(cy+dy*scale)];
      }
      function visualLabel(label) {
        var x=scaled(label.u), y=scaled(label.v), tx=scaled(label.tx), ty=scaled(label.ty), width=plaqueWidth(label.label);
        var px=Math.max(6,Math.min(994-width,tx-width/2)), py=Math.max(23,Math.min(956,ty-18)), tone=esc(label.tone || 'neutral');
        var end=leaderEnd(x,y,px,py,width,36);
        return '<g class="map-label" data-point="'+esc(label.id)+'" data-plaque-center="'+tx+'"><path class="map-line map-line--label map-line--'+tone+'" d="M '+x+' '+y+' L '+end[0]+' '+end[1]+'"></path><circle class="map-anchor map-anchor--'+tone+'" cx="'+x+'" cy="'+y+'" r="8"></circle><rect class="map-plaque map-plaque--'+tone+'" data-min-width="'+width+'" x="'+Math.round(px)+'" y="'+Math.round(py)+'" width="'+width+'" height="36"></rect><text class="map-text" x="'+Math.round(px+11)+'" y="'+Math.round(py+24)+'">'+esc(label.label)+'</text></g>';
      }
      function visualRoute(item) {
        var points=(item.points||[]).map(function(p){return scaled(p[0])+','+scaled(p[1]);}).join(' '), tone=esc(item.tone||'t');
        return '<polyline class="map-line map-route map-line--'+tone+'" marker-end="url(#arrow-'+tone+')" points="'+points+'"></polyline>';
      }
      function visualPin(pin,index,tone) {
        var x=scaled(pin.u), y=scaled(pin.v), lx=scaled(pin.lu), ly=scaled(pin.lv), anchor=pin.anchor||'middle';
        var width=Math.max(90,String(pin.label).length*9+18), left=anchor==='start'?lx-8:anchor==='end'?lx-width+8:lx-width/2;
        left=Math.max(6,Math.min(994-width,left));lx=anchor==='start'?left+8:anchor==='end'?left+width-8:left+width/2;
        var end=leaderEnd(x,y,left,ly-17,width,28);
        return '<g class="map-pin-group" data-player="'+esc(pin.player||'')+'"><path class="map-pin__leader" d="M '+x+' '+y+' L '+end[0]+' '+end[1]+'"></path><circle class="map-pin map-pin--'+esc(tone||'t')+'" cx="'+x+'" cy="'+y+'" r="17"></circle><text class="map-pin__text" x="'+x+'" y="'+y+'">'+esc(pin.n||index+1)+'</text><rect class="map-pin__plaque" x="'+left+'" y="'+(ly-17)+'" width="'+width+'" height="28"></rect><text class="map-pin__label" x="'+lx+'" y="'+(ly-3)+'" style="text-anchor:'+anchor+'">'+esc(pin.label)+'</text></g>';
      }
      function defs(){return '<defs><marker id="arrow-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path fill="#f0a43a" d="M0,0 L8,4 L0,8 z"></path></marker><marker id="arrow-ct" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path fill="#55b9ed" d="M0,0 L8,4 L0,8 z"></path></marker><marker id="arrow-signal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path fill="#ff647c" d="M0,0 L8,4 L0,8 z"></path></marker></defs>';}
      function fitMapLabels(){Array.prototype.forEach.call(root.querySelectorAll('.map-label'),function(g){var p=g.querySelector('.map-plaque'),t=g.querySelector('.map-text'),a=g.querySelector('.map-anchor'),l=g.querySelector('.map-line--label');if(!p||!t||!a||!l)return;var w=Number(p.getAttribute('data-min-width'))||0;try{w=Math.max(w,Math.ceil(t.getComputedTextLength()+22));}catch(e){}w=Math.min(988,w);var c=Number(g.getAttribute('data-plaque-center')),left=Math.max(6,Math.min(994-w,c-w/2)),top=Number(p.getAttribute('y')),end=leaderEnd(Number(a.getAttribute('cx')),Number(a.getAttribute('cy')),left,top,w,Number(p.getAttribute('height')));p.setAttribute('x',Math.round(left));p.setAttribute('width',Math.round(w));t.setAttribute('x',Math.round(left+11));l.setAttribute('d','M '+a.getAttribute('cx')+' '+a.getAttribute('cy')+' L '+end[0]+' '+end[1]);});}
      function renderScene(scene) {
        var labels=(scene.labels||[]).map(visualLabel).join(''), routes=(scene.routes||[]).map(visualRoute).join(''), pins=(scene.pins||[]).map(function(p,i){return visualPin(p,i,scene.pinTone||'t');}).join('');
        return '<figure class="visual"><div class="visual-frame"><img src="'+scenes.radar.image+'" alt="'+scenes.radar.alt+'"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">'+defs()+routes+labels+pins+'</svg></div><figcaption class="visual-caption"><span>'+scenes.radar.source+'</span><span>'+scenes.radar.coordinateSystem+'</span></figcaption></figure>';
      }
      function nadeCards(from,to){return '<div class="nade-grid">'+nades.slice(from,to).map(function(nade){var tone=nade.side==='CT'?'ct':'t';return '<article class="nade-card"><div class="nade-card__head"><h3>'+esc(nade.id+' · '+nade.name)+'</h3><span class="side side--'+tone+'">'+nade.side+'</span></div><p class="nade-card__use">'+esc(nade.use)+'</p><div class="nade-frames"><figure class="nade-frame"><img src="'+nade.positionFrame+'" alt="'+esc(nade.id+': позиция из CSNADES')+'"><figcaption>Позиция</figcaption></figure><figure class="nade-frame"><img src="'+nade.aimFrame+'" alt="'+esc(nade.id+': прицел или результат из CSNADES')+'"><figcaption>Прицел / результат</figcaption></figure></div><dl class="nade-data"><div><dt>Владелец / резерв</dt><dd><strong>'+esc(nade.owner)+'</strong> / '+esc(nade.backup)+'</dd></div><div><dt>Бросок</dt><dd>'+esc(nade.throw)+'</dd></div><div><dt>Критерий</dt><dd>'+esc(nade.criterion)+'</dd></div></dl><a class="nade-link" href="'+nade.url+'" target="_blank" rel="noopener noreferrer">Конкретная страница CSNADES ↗</a></article>';}).join('')+'</div>';}
      function videoRefMarkup(refs){refs=refs||[];return refs.length?'<div class="video-refs" aria-label="Видеоразбор этого блока">'+refs.map(function(ref){return '<a class="video-ref" href="https://www.youtube.com/watch?v='+esc(ref.id)+'&amp;t='+ref.start+'s" target="_blank" rel="noopener noreferrer"><span class="video-ref__label">▶ Видео</span><span class="video-ref__range">'+esc(ref.range)+'</span><span class="video-ref__topic">'+esc(ref.topic)+'</span></a>';}).join('')+'</div>':'';}

      var slides = [
        { short:'Старт', kicker:'01 · рамка', minutes:'01 мин', render:function(){return '<section class="cover"><div><h1 id="slide-title-1">Mirage<br><span style="color:var(--sand)">по одному</span><br>сигналу</h1><p class="lead">Тренировка команды: единый радар, измеримый контроль мида и два полноценных выхода с заранее известными условиями остановки.</p><div class="tokens"><span class="token">26 слайдов</span><span class="token">56 минут</span><span class="token">28 минут личной практики</span><span class="token">10 гранат</span></div><p class="big-quote">«Инфо. Решение.<br>Один общий вход.»</p></div><div class="cover-map"><img src="assets/mirage-game-radar.webp" alt="Чистый игровой радар Mirage на обложке"></div></section>'; } },
        { short:'Цель', kicker:'02 · результат', minutes:'02 мин', render:function(){return '<h2 id="slide-title-2">Цель тренировки</h2><p class="lead">К концу сессии каждый знает свою стартовую роль, первый маршрут, владельцев гранат и точный сигнал выхода.</p><div class="number-grid"><article class="number-card"><b>18</b><span>русских коллов привязаны к якорям</span></article><article class="number-card"><b>2</b><span>выхода прогоняем полным составом</span></article><article class="number-card"><b>10</b><span>гранат проходят live-проверку</span></article><article class="number-card"><b>0</b><span>одиночных входов после STOP</span></article></div><div class="coach"><b>Критерий сессии:</b> три чистых повтора A и B подряд, без опоздавшей гранаты; единственный капитан — D4ba.</div>'; } },
        { short:'Радар / коллы', kicker:'03 · язык команды', minutes:'03 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-3">Радар и русские коллы</h2><p class="lead">Каждая подпись вынесена в свободную зону. Точка-якорь остаётся на самой позиции, линия показывает точную привязку.</p><ul class="list"><li><b>Яма A</b> означает Ramp / Main.</li><li><b>Ковры A</b> означают Palace, <b>ковры B</b> означают Apartments.</li><li><b>Сити</b> означает Ticket Booth, <b>кухня</b> означает Market.</li><li><b>Окно</b> без уточнения означает окно мида.</li></ul></div>'+renderScene(scenes.callouts)+'</div>'; } },
        { short:'Дрилл коллов', kicker:'04 · голос', minutes:'02 мин', render:function(){return '<div class="columns columns--even"><div><h2 id="slide-title-4">Формат короткого колла</h2><p class="lead">Игрок сообщает точку, число и своё действие. Команда слышит факт и понимает, что останется открытым.</p><div class="flow"><div class="flow__step"><b>Точка</b><p>«Шорт» или «ковры B».</p></div><div class="flow__step"><b>Число</b><p>«Один» или «два плюс».</p></div><div class="flow__step flow__step--success"><b>Действие</b><p>«Отхожу», «держу», «флеш готова».</p></div></div></div><div class="stack"><article class="panel panel--ct"><p class="panel__kicker">Правильно</p><h3>«Шорт, два, падаю кухню»</h3><p>В колле есть место, объём угрозы и дальнейшее действие.</p></article><article class="panel panel--signal"><p class="panel__kicker">Нельзя</p><h3>«Там справа»</h3><p>Без зоны и числа этот колл заставляет партнёра угадывать.</p></article></div></div>'; } },
        { short:'Роли команды', kicker:'05 · состав', minutes:'02 мин', render:function(){return '<h2 id="slide-title-5">Роли команды на Mirage</h2><p class="lead">Распределение служит тренировочной точкой старта. После трёх скримов меняем роль только по записи конкретной проблемы.</p><div class="role-strip"><article><b>L!S</b><span>Первый вход. Начинает контакт после команды D4ba.</span></article><article><b>D4ba</b><span>Капитан и размен. Даёт GO, STOP и SUCCESS; на CT держит A и задерживает яму молотовом.</span></article><article><b>d0lfero</b><span>Бомба и опорник B. После плента не уходит первым.</span></article><article><b>middle</b><span>AWP / мид. Первый даёт инфо и выбирает безопасный отход.</span></article><article><b>Reconnecting</b><span>Гранаты и второй темп. Страхует ключевые смоки.</span></article></div><div class="coach"><b>Общее правило:</b> роль описывает порядок действий. Ник игрока не заменяет колл.</div>'; } },
        { short:'Дефолт T', kicker:'06 · T', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-6">Дефолт T: 2 / 2 / 1</h2><p class="lead">Двое занимают яму A без раннего входа. Двое готовят мид. Один слушает ковры B и сохраняет возможность позднего давления.</p><ul class="list"><li><b>L!S + D4ba:</b> яма A, очистить пуш, сохранить две гранаты.</li><li><b>middle + Reconnecting:</b> смоки окна и коннектора, затем инфо.</li><li><b>d0lfero:</b> ковры B, бомба остаётся вне первого контакта.</li></ul><div class="coach"><b>Точка решения:</b> около 1:15. Без контроля мида остаёмся в безопасных зонах.</div></div>'+renderScene(scenes.tDefault)+'</div>'; } },
        { short:'Контроль мида', kicker:'07 · T / мид', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-7">Контроль мида: окно, коннектор, шорт</h2><p class="lead">N-01 и N-02 открывают первый шаг. После них middle не прыгает за информацией в одиночку: пара выбирает коннектор или шорт по видимому ответу CT.</p><div class="flow"><div class="flow__step"><b>GO</b><p>Оба смока легли, флеш готова, второй игрок рядом.</p></div><div class="flow__step flow__step--stop"><b>STOP</b><p>Щель в окне, потерян первый игрок или нет размена.</p></div><div class="flow__step flow__step--success"><b>SUCCESS</b><p>Верх мида занят, окно и коннектор проверены.</p></div></div></div>'+renderScene(scenes.midControl)+'</div>'; } },
        { short:'T решение', kicker:'08 · T / капитан', minutes:'02 мин', render:function(){return '<h2 id="slide-title-8">Решение после мида</h2><p class="lead">D4ba выбирает одну ветку только после короткого отчёта middle. Ответ занимает одну фразу.</p><div class="columns columns--even" style="height:auto;margin-top:18px"><article class="panel panel--t"><p class="panel__kicker">Ветка A</p><h3>«Окно закрыто, коннектор пуст»</h3><p>middle остаётся в коннекторе. Тройка ямы и ковров A готовит три смока и общий вход.</p></article><article class="panel panel--t"><p class="panel__kicker">Ветка B</p><h3>«Шорт наш, B без второй пары»</h3><p>middle остаётся на шорте. Тройка ковров B готовит окно кухни, скамейку и правый проход.</p></article></div><div class="coach"><b>Если данных нет:</b> D4ba сохраняет дефолт ещё 8–10 секунд. Случайная дуэль не считается решением.</div>'; } },
        { short:'A роли', kicker:'09 · T / A', minutes:'02 мин', render:function(){return '<div class="columns columns--even"><div><h2 id="slide-title-9">Выход A: роли и порядок</h2><p class="lead">Основная ветка идёт из ямы A и ковров A. Мид остаётся вторым направлением только после контроля коннектора.</p><ul class="list"><li><b>L!S:</b> первый из ямы, чистит тетрис и ближний сайт.</li><li><b>D4ba:</b> капитан и размен на дистанции одного корпуса.</li><li><b>d0lfero:</b> несёт бомбу, ставит после SUCCESS.</li><li><b>middle:</b> держит коннектор и джангл.</li><li><b>Reconnecting:</b> N-03, затем последняя флеш.</li></ul></div><div class="stack"><article class="panel panel--signal"><p class="panel__kicker">Перед входом</p><h3>Три отсечки видимы</h3><p>Джангл/коннектор, лестница и верх сити. Если одна не легла, D4ba говорит STOP.</p></article><article class="panel"><p class="panel__kicker">Порядок углов</p><p>Тетрис, ближний сайт, дефолт, трипл, затем сити. Бомба не обгоняет проверку.</p></article></div></div>'; } },
        { short:'Выход A', kicker:'10 · T / A', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-10">Выход A: яма плюс ковры</h2><p class="lead">Гранаты летят на одном счёте. L!S выходит через секунду после последней вспышки. middle показывает коннектор только после контакта основной пары.</p><div class="flow"><div class="flow__step"><b>1 · Гранаты</b><p>N-03, N-04, N-05 подтверждены голосом.</p></div><div class="flow__step"><b>2 · Контакт</b><p>L!S и D4ba проходят яму одной парой.</p></div><div class="flow__step flow__step--success"><b>3 · Плент</b><p>d0lfero ставит после «сайт наш».</p></div></div></div>'+renderScene(scenes.aExecute)+'</div>'; } },
        { short:'A GO / STOP', kicker:'11 · T / A', minutes:'02 мин', render:function(){return '<h2 id="slide-title-11">A: окно решений</h2><p class="lead">Слова GO, STOP и SUCCESS означают наблюдаемые условия. Они не зависят от настроения игрока.</p><div class="flow"><div class="flow__step"><b>GO</b><p>Тройка смоков легла. L!S, D4ba и бомба готовы. middle держит коннектор.</p></div><div class="flow__step flow__step--stop"><b>STOP</b><p>Смок джангла с щелью, ковры A не готовы, энтри потерян до счёта.</p></div><div class="flow__step flow__step--success"><b>SUCCESS</b><p>Сайт очищен до трипла, сити отсечён, бомба дошла до дефолта.</p></div></div><div class="coach"><b>После STOP:</b> никто не «доигрывает идею». Возврат в тетрис, коннектор и яму сохраняет следующий вызов.</div>'; } },
        { short:'A постплент', kicker:'12 · T / A', minutes:'02 мин', render:function(){return '<div class="columns columns--even"><div><h2 id="slide-title-12">A постплент: четыре линии</h2><p class="lead">После плента команда закрывает доступы. Поиск дополнительных фрагов открывает ретейк CT.</p><ul class="list"><li><b>Яма A:</b> L!S держит выход сити.</li><li><b>Тетрис:</b> D4ba страхует дефолт и джангл.</li><li><b>Дефолт:</b> d0lfero остаётся живым после установки.</li><li><b>Ковры A:</b> Reconnecting слушает выход и сохраняет флеш.</li><li><b>Коннектор:</b> middle держит джангл и ротацию.</li></ul></div><article class="panel panel--ct"><p class="panel__kicker">Ожидаемый ретейк</p><h3>Сити плюс джангл</h3><p>Первый контакт не меняет все линии. Игрок на тетрисе помогает дефолту, игрок ямы продолжает держать сити.</p><p><span class="call call--success">SUCCESS:</span> бомба видна минимум двум игрокам, фланг назван.</p></article></div>'; } },
        { short:'B роли', kicker:'13 · T / B', minutes:'02 мин', render:function(){return '<div class="columns columns--even"><div><h2 id="slide-title-13">Выход B: роли и порядок</h2><p class="lead">Тройка ковров B создаёт первый контакт. middle приходит с шорта и не опережает основной вход.</p><ul class="list"><li><b>L!S:</b> прыжок из ковров, ближняя машина.</li><li><b>D4ba:</b> размен и скамейка.</li><li><b>d0lfero:</b> бомба и дефолт B.</li><li><b>middle:</b> шорт, правый проход и кухня.</li><li><b>Reconnecting:</b> N-06 и финальная флеш ковров.</li></ul></div><article class="panel panel--signal"><p class="panel__kicker">Главный риск</p><h3>Шорт приходит слишком рано</h3><p>Если middle показывает шорт до выхода ковров, CT разворачиваются и играют две отдельные дуэли. Синхронизация важнее первого пика.</p></article></div>'; } },
        { short:'B подготовка', kicker:'14 · T / B', minutes:'02 мин', render:function(){return '<h2 id="slide-title-14">B: подготовка до контакта</h2><p class="lead">Три смока образуют один пакет. Команда проговаривает результат каждой гранаты до старта движения.</p><div class="flow"><div class="flow__step"><b>N-06 · окно кухни</b><p>Reconnecting подтверждает посадку. Дверь кухни остаётся отдельным углом.</p></div><div class="flow__step"><b>N-07 · скамейка</b><p>D4ba бросает до выхода L!S, затем занимает размен.</p></div><div class="flow__step"><b>N-08 · правый проход</b><p>middle закрывает проход с аллеи и приходит на шорт.</p></div></div><div class="coach"><b>Счёт:</b> «три, два, один, гранаты»; после видимых посадок D4ba отдельно говорит GO.</div>'; } },
        { short:'Выход B', kicker:'15 · T / B', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-15">Выход B: ковры плюс шорт</h2><p class="lead">Ковры начинают на полшага раньше. Шорт появляется в момент первого разворота CT, а не во время полёта смоков.</p><div class="flow"><div class="flow__step"><b>1 · Ковры</b><p>L!S проверяет машину, D4ba держит размен.</p></div><div class="flow__step"><b>2 · Шорт</b><p>middle связывает сайт с кухней.</p></div><div class="flow__step flow__step--success"><b>3 · Плент</b><p>d0lfero ставит после контроля ближней площадки.</p></div></div></div>'+renderScene(scenes.bExecute)+'</div>'; } },
        { short:'B постплент', kicker:'16 · T / B', minutes:'02 мин', render:function(){return '<div class="columns columns--even"><div><h2 id="slide-title-16">B постплент: сайт не растягиваем</h2><p class="lead">Два игрока контролируют кухню, один сохраняет шорт, двое играют бомбу из ковров и сайта.</p><ul class="list"><li><b>Ковры:</b> L!S играет таймер и фланг.</li><li><b>Сайт:</b> D4ba страхует бомбу.</li><li><b>Дефолт B:</b> d0lfero ставит и смещается в безопасный угол.</li><li><b>Шорт:</b> middle не прыгает в кухню без команды.</li><li><b>Скамейка:</b> Reconnecting хранит флеш ретейка.</li></ul></div><article class="panel panel--ct"><p class="panel__kicker">Ожидаемый ретейк</p><h3>Кухня плюс шорт</h3><p>Первый дым CT принимаем голосом. Если кухня закрыла обзор, команда не выходит через смок по одному.</p><p><span class="call call--success">SUCCESS:</span> бомба видна из двух позиций, ковры B не отданы бесплатно.</p></article></div>'; } },
        { short:'CT принципы', kicker:'17 · CT', minutes:'02 мин', render:function(){return '<h2 id="slide-title-17">CT: жизнь якоря покупает ретейк</h2><p class="lead">На Mirage ранний отход сильнее второго сухого пика. Якорь задерживает выход, сообщает число и оставляет команде две точки входа.</p><div class="flow"><div class="flow__step"><b>Контакт</b><p>Точка, число, видимые гранаты.</p></div><div class="flow__step"><b>Задержка</b><p>Одна граната и безопасный отход.</p></div><div class="flow__step flow__step--success"><b>Сбор</b><p>Ретейк после готовой флешки и общего счёта.</p></div></div><div class="coach"><b>Ротация:</b> полный переход начинается по трём соперникам, бомбе или подтверждённому выходу. Один шум оставляет второго якоря на месте.</div>'; } },
        { short:'Дефолт CT', kicker:'18 · CT', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-18">Дефолт CT: 2 / 1 / 2</h2><p class="lead">D4ba и L!S держат A. middle отвечает за окно и первое инфо. d0lfero и Reconnecting связывают B с шортом.</p><ul class="list"><li><b>A:</b> сити плюс сайт, N-09 тормозит яму.</li><li><b>Мид:</b> окно, затем безопасный отход в джангл.</li><li><b>B:</b> сайт плюс шорт, N-10 тормозит ковры.</li></ul><div class="coach"><b>Связь:</b> middle сообщает потерю мида раньше, чем CT меняют позиции.</div></div>'+renderScene(scenes.ctDefault)+'</div>'; } },
        { short:'CT реакция A', kicker:'19 · CT / A', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-19">CT реакция на A</h2><p class="lead">D4ba даёт N-09 и отходит. L!S с сити не форсит дым. middle приходит через джангл после подтверждения выхода.</p><div class="flow"><div class="flow__step"><b>GO ретейка</b><p>Три игрока собраны, есть флеш, бомба поставлена.</p></div><div class="flow__step flow__step--stop"><b>STOP</b><p>Якорь умер без инфо или джангл отрезан.</p></div><div class="flow__step flow__step--success"><b>SUCCESS</b><p>Сити и джангл входят на одну вспышку.</p></div></div></div>'+renderScene(scenes.ctReactionA)+'</div>'; } },
        { short:'CT реакция B', kicker:'20 · CT / B', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-20">CT реакция на B</h2><p class="lead">d0lfero задерживает ковры N-10 и остаётся живым. Reconnecting держит шорт. Первым ротирует middle, A сохраняет одного игрока.</p><div class="flow"><div class="flow__step"><b>GO ретейка</b><p>Кухня и шорт готовы, флеш названа.</p></div><div class="flow__step flow__step--stop"><b>STOP</b><p>Шорт потерян или кухня закрыта без размена.</p></div><div class="flow__step flow__step--success"><b>SUCCESS</b><p>Сайт сжат двумя входами, дефьюз защищён.</p></div></div></div>'+renderScene(scenes.ctReactionB)+'</div>'; } },
        { short:'Ретейк A', kicker:'21 · CT / ретейк', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-21">Ретейк A: сити плюс джангл</h2><p class="lead">Сити входит первым только после флешки джангла. Второй игрок проверяет тетрис, третий держит яму и бомбу.</p><ul class="list"><li><b>Сбор:</b> три игрока и одна флеш.</li><li><b>Первый фокус:</b> тетрис и дефолт.</li><li><b>После фрага:</b> закрепить дефьюз, не гнаться в яму.</li></ul><div class="coach"><b>Отмена:</b> если осталось меньше времени, чем нужно на общий вход и дефьюз, D4ba вызывает сохранение.</div></div>'+renderScene(scenes.retakeA)+'</div>'; } },
        { short:'Ретейк B', kicker:'22 · CT / ретейк', minutes:'02 мин', render:function(){return '<div class="columns"><div><h2 id="slide-title-22">Ретейк B: кухня плюс шорт</h2><p class="lead">Кухня даёт первую гранату. Шорт ждёт вспышку и только после неё проверяет сайт. Ковры остаются последним углом.</p><ul class="list"><li><b>Сбор:</b> дверь кухни закрыта партнёром.</li><li><b>Первый фокус:</b> сайт и скамейка.</li><li><b>После дефьюза:</b> один игрок держит ковры B.</li></ul><div class="coach"><b>Отмена:</b> два игрока без гранат против трёх закрепившихся T сохраняют оружие.</div></div>'+renderScene(scenes.retakeB)+'</div>'; } },
        { short:'Гранаты 1–5', kicker:'23 · гранаты', minutes:'04 мин', render:function(){return '<h2 id="slide-title-23">Гранаты 1–5: мид и A</h2><p class="lead">Локальные кадры взяты с конкретных страниц CSNADES. Они показывают опубликованную позицию и прицел/результат, но не заменяют live-прогон на текущем клиенте.</p>'+nadeCards(0,5); } },
        { short:'Гранаты 6–10', kicker:'24 · гранаты', minutes:'04 мин', render:function(){return '<h2 id="slide-title-24">Гранаты 6–10: B и задержка CT</h2><p class="lead">Карточка становится обязательной только после критерия 5/5 для точного броска или 3/3 для движения и свободной точности.</p>'+nadeCards(5,10); } },
        { short:'GO / STOP / SUCCESS', kicker:'25 · протокол', minutes:'02 мин', render:function(){return '<h2 id="slide-title-25">GO / STOP / SUCCESS</h2><p class="lead">Три слова управляют всей пятёркой. У каждого слова есть проверяемое условие и одно обязательное действие.</p><div class="flow"><div class="flow__step"><b>GO · D4ba</b><p>Люди и гранаты готовы. Все начинают утверждённую последовательность.</p></div><div class="flow__step flow__step--stop"><b>STOP · любой</b><p>Названа конкретная проблема. Команда прекращает вход и возвращается к безопасным углам.</p></div><div class="flow__step flow__step--success"><b>SUCCESS · D4ba</b><p>Зона очищена до критерия. Бомба ставится, игроки занимают постплент.</p></div></div><div class="coach"><b>Запрет:</b> STOP без причины не используем. Формат: «STOP, щель джангл» или «STOP, middle отрезан».</div>'; } },
        { short:'Домашняя работа', kicker:'26 · закрепление', minutes:'02 мин', render:function(){return '<h2 id="slide-title-26">Домашняя работа и финальный тест</h2><p class="lead">28 минут индивидуальной практики возвращают команде запись, которую можно проверить на следующей тренировке.</p><div class="timeline"><article class="timeline__item"><b>06 мин</b><span>Пройти 18 русских коллов по радару.</span></article><article class="timeline__item"><b>10 мин</b><span>Повторить две свои гранаты до критерия.</span></article><article class="timeline__item"><b>07 мин</b><span>Записать позицию, прицел и посадку.</span></article><article class="timeline__item"><b>05 мин</b><span>Ответить на 8 вопросов D4ba.</span></article></div><div class="columns columns--even" style="height:auto;margin-top:10px"><article class="panel"><p class="panel__kicker">8 вопросов</p><p>1. Пять ролей? 2. Первый колл мида? 3. STOP для A? 4. STOP для B? 5. Плент A? 6. Плент B? 7. Два входа ретейка A? 8. Два входа ретейка B?</p></article><section class="source-panel"><h3>Источники и границы</h3><p>В реестре разделены опубликованные факты, координаты радара и тренерские решения.</p><div class="source-links"><a href="sources.md" target="_blank">Открыть sources.md</a><a href="https://csnades.gg/mirage/callouts" target="_blank" rel="noopener noreferrer">CSNADES callouts ↗</a></div></section></div>'; } }
      ];

      Object.keys(tacticalVideos).forEach(function(slideIndex){slides[Number(slideIndex)-1].videos=tacticalVideos[slideIndex];});

      function fromQuery(){var n=Number(new URLSearchParams(location.search).get('slide'));return n>=1&&n<=slides.length?n-1:0;}
      function slideMarkup(slide){return '<article class="slide'+(slide.videos?' slide--has-video':'')+'" data-slide-index="'+(activeIndex+1)+'" aria-labelledby="slide-title-'+(activeIndex+1)+'"><div class="slide__meta"><span class="slide__tag">'+esc(slide.kicker)+'</span>'+videoRefMarkup(slide.videos)+'<span>'+esc(slide.minutes)+'</span></div>'+slide.render()+'</article>';}
      function render(index,focus){activeIndex=Math.max(0,Math.min(slides.length-1,index));var slide=slides[activeIndex];root.innerHTML=slideMarkup(slide);fitMapLabels();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitMapLabels);previous.disabled=activeIndex===0;next.disabled=activeIndex===slides.length-1;picker.value=String(activeIndex);progressText.textContent=String(activeIndex+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');progressBar.style.setProperty('--progress',((activeIndex+1)/slides.length*100)+'%');document.title=(activeIndex+1)+'. '+slide.short+' · Mirage · командная тренировка';var url=new URL(location.href);url.searchParams.set('slide',String(activeIndex+1));history.replaceState({slide:activeIndex+1},'',url);if(focus)main.focus({preventScroll:true});}
      function go(delta){render(activeIndex+delta,true);}
      function drawTimer(){var ms=timerOffset+(timerStartedAt?Date.now()-timerStartedAt:0),s=Math.floor(ms/1000);timerReadout.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
      function toggleTimer(){if(timerStartedAt){timerOffset+=Date.now()-timerStartedAt;timerStartedAt=0;clearInterval(timerInterval);timerInterval=null;timerButton.textContent='Старт';timerButton.setAttribute('aria-pressed','false');}else{timerStartedAt=Date.now();timerInterval=setInterval(drawTimer,250);timerButton.textContent='Пауза';timerButton.setAttribute('aria-pressed','true');}drawTimer();}
      function toggleFullscreen(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
      slides.forEach(function(slide,index){var option=document.createElement('option');option.value=String(index);option.textContent=String(index+1).padStart(2,'0')+' · '+slide.short;picker.appendChild(option);});
      previous.addEventListener('click',function(){go(-1);});next.addEventListener('click',function(){go(1);});picker.addEventListener('change',function(){render(Number(picker.value),true);});timerButton.addEventListener('click',toggleTimer);fullscreenButton.addEventListener('click',toggleFullscreen);
      document.addEventListener('keydown',function(event){if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target&&event.target.tagName))return;if(event.key==='ArrowRight'||event.key==='PageDown'){event.preventDefault();go(1);}else if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();go(-1);}else if(event.key==='Home'){event.preventDefault();render(0,true);}else if(event.key==='End'){event.preventDefault();render(slides.length-1,true);}else if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen();}});
      window.addEventListener('popstate',function(){render(fromQuery(),false);});render(fromQuery(),false);drawTimer();
    })();
