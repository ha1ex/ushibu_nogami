name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kb-doctor:
    name: KB health-check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install frozen dependencies
        run: corepack pnpm run setup

      # Syntax-check ключевых .mjs (без загрузки 120MB ONNX-модели).
      - name: Syntax check (node --check)
        run: |
          node --check scripts/kb-doctor.mjs
          node --check scripts/dream-cycle.mjs
          node --check scripts/semantic/index.mjs
          node --check scripts/semantic/search.mjs

      - name: Run deterministic quality gate
        run: corepack pnpm kb:check

      - name: Verify Corepack bootstrap without recursion
        run: node --test scripts/agent/test-corepack-bootstrap.mjs
